<text x="462.0" y="82.0" class="t" text-anchor="start">New(8) allocates one 8-byte slice. Capacity is a power of two, so</text>
<text x="462.0" y="104.0" class="t" text-anchor="start">a cursor wraps with  pos &amp; (Cap−1)  instead of a modulo.</text>
<rect x="462" y="126" width="10" height="10" rx="2" class="wr"/>
<text x="480.0" y="136.0" class="t" text-anchor="start">Write copies bytes in at writePos and moves it forward.</text>
<rect x="462" y="148" width="10" height="10" rx="2" class="rd"/>
<text x="480.0" y="158.0" class="t" text-anchor="start">Read copies bytes out from readPos and moves it forward.</text>
<text x="462.0" y="190.0" class="t" text-anchor="start">Here the 5 unread bytes run from slot 6 past the end to slot 2:</text>
<text x="462.0" y="212.0" class="t" text-anchor="start">Len() = 5, Available() = 3, and Read returns &quot;bytes&quot;.</text>
<text x="462.0" y="244.0" class="s" text-anchor="start">One mutex guards the cursors. Two sync.Conds wake blocked readers</text>
<text x="462.0" y="266.0" class="s" text-anchor="start">and writers, each with one reused timer for timeouts.</text>
<rect class="panel" x="16" y="322" width="436" height="338" rx="10"/>
<text x="36.0" y="352.0" class="h" text-anchor="start">Overwrite (default)</text>
<text x="36.0" y="372.0" class="s m" text-anchor="start">WithOverWrite(true)</text>
<text x="36.0" y="402.0" class="t" text-anchor="start">Full: Len() = 8, Available() = 0</text>
