<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 676" width="920" height="676" role="img" aria-labelledby="title desc">
<title id="title">How the ring buffer works</title>
<desc id="desc">An 8-byte ring with read and write cursors that wrap around, and a step-by-step comparison of overwrite mode, which drops the oldest bytes, and backpressure mode, which blocks the writer until a reader frees room.</desc>
